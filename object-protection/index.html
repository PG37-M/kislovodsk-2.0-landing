<script>
(function () {
  var track = document.getElementById('track');
  var slides = Array.prototype.slice.call(track.children);
  var dots = Array.prototype.slice.call(document.getElementById('dots').children);
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var cur = document.getElementById('cur');
  var bar = document.getElementById('bar');
  var n = slides.length;
  var index = 0;

  function go(i) {
    i = Math.max(0, Math.min(n - 1, i));
    track.scrollTo({ left: slides[i].offsetLeft, behavior: 'smooth' });
  }

  function sync() {
    if (!track.clientWidth) return;
    var i = Math.round(track.scrollLeft / track.clientWidth);
    i = Math.max(0, Math.min(n - 1, i));
    if (i !== index) {
      dots[index] && dots[index].classList.remove('active');
      index = i;
    }
    dots[index].classList.add('active');
    cur.textContent = index + 1;
    bar.style.width = ((index + 1) / n * 100) + '%';
    prev.disabled = index === 0;
    next.disabled = index === n - 1;
  }

  var raf;
  track.addEventListener('scroll', function () {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(sync);
  }, { passive: true });

  prev.addEventListener('click', function () { go(index - 1); });
  next.addEventListener('click', function () { go(index + 1); });
  dots.forEach(function (d) {
    d.addEventListener('click', function () { go(+d.dataset.i); });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(index + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(index - 1); }
    else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(n - 1); }
    else if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') { toggleFs(); }
  });

  // колесо мыши по горизонтали / шифт-скролл
  track.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.shiftKey) {
      e.preventDefault();
      if (wheelLock) return;
      wheelLock = true;
      setTimeout(function () { wheelLock = false; }, 420);
      go(index + (e.deltaY > 0 ? 1 : -1));
    }
  }, { passive: false });

    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }

  window.addEventListener('resize', function () {

    track.style.scrollBehavior = 'auto';
    track.scrollLeft = slides[index].offsetLeft;

    track.scrollLeft = slides[h - 1].offsetLeft;
    track.style.scrollBehavior = 'smooth';
  }
  sync();
})();
